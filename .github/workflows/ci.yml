name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run against next@canary (PRD §16: Turbopack loader semantics may change).
    - cron: '0 6 * * 1'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - name: Packed tarball resolves in plain Node
        run: node scripts/smoke-pack.mjs
      - name: Production footprint (PRD §13)
        working-directory: examples/next-app
        run: |
          pnpm exec next build
          if grep -rq 'data-rl="' .next/server/app; then echo 'data-rl leaked into a production render'; exit 1; fi
          if grep -rq 'rl-toolbar' .next/static; then echo 'overlay shipped in a production client bundle'; exit 1; fi
          rm -rf .next
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  canary:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter next-app add next@canary
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
